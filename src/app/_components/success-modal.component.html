<div *ngIf="isVisible" class="modal show d-block" tabindex="-1" style="background-color: rgba(0,0,0,0.5);">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title">
          <i class="fas fa-check-circle"></i> Registration Successful!
        </h5>
        <button type="button" class="btn-close btn-close-white" (click)="close()"></button>
      </div>
      <div class="modal-body">
        <div class="text-center mb-3">
          <i class="fas fa-envelope fa-4x text-success"></i>
        </div>
        <p>Registration successful! A verification email has been sent to:</p>
        <p class="alert alert-info">
          <strong>{{ email }}</strong>
        </p>
        <div class="alert alert-warning">
          <i class="fas fa-info-circle"></i>
          <strong>Important:</strong> Please check your inbox and click the verification link to activate your account.
          <br><br>
          <small>Didn't receive the email? Check your spam folder.</small>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" (click)="navigateToLogin()">
          Go to Login
        </button>
      </div>
    </div>
  </div>
</div>
