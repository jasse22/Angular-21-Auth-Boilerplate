<h4 class="card-title">Forgot Password</h4>
<p>Enter your email to reset your password.</p>
<form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div *ngIf="!submitted">
        <div class="form-group mb-3">
            <label class="form-label">Email</label>
            <input type="text" formControlName="email" class="form-control" [ngClass]="{ 'is-invalid': f['email'].dirty && f['email'].errors }" />
            <div *ngIf="f['email'].dirty && f['email'].errors" class="invalid-feedback">
                <div *ngIf="f['email'].errors['required']">Email is required</div>
                <div *ngIf="f['email'].errors['email']">Email must be a valid email address</div>
            </div>
        </div>
        <div class="d-flex align-items-center">
            <button [disabled]="loading" class="btn btn-primary me-2">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
                Submit
            </button>
            <a routerLink="../login">Cancel</a>
        </div>
    </div>
    <div *ngIf="submitted" class="alert alert-success mt-3 mb-0">
        Please check your email for password reset instructions
    </div>
</form>
